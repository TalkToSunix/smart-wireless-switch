<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset=".55" stop-color="#11253b"/><stop offset="1" stop-color="#142e43"/></linearGradient><linearGradient id="mint"><stop stop-color="#94ffe0"/><stop offset="1" stop-color="#36c7a5"/></linearGradient><linearGradient id="bolt" x2="0" y2="1"><stop stop-color="#fff3aa"/><stop offset="1" stop-color="#ffbd48"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#91b3cb" opacity=".22"/></pattern></defs>
<rect width="1400" height="500" rx="30" fill="url(#bg)"/><rect width="1400" height="500" rx="30" fill="url(#dots)"/><circle cx="700" cy="250" r="205" fill="#29c7a0" opacity=".05"><animate attributeName="r" values="195;218;195" dur="5s" repeatCount="indefinite"/></circle>
<!-- board left -->
<g transform="translate(130 135)"><rect width="275" height="230" rx="24" fill="#116453" stroke="#56d6ac" stroke-width="2"/><rect x="73" y="39" width="130" height="133" rx="14" fill="#17283a" stroke="#6c8394"/><rect x="97" y="60" width="82" height="93" rx="9" fill="#2b4053"/><path d="M107 76h62M107 90h62M107 104h62M107 118h62M107 132h62" stroke="#8ea1ae" stroke-width="4"/><rect x="108" y="184" width="58" height="22" rx="5" fill="#c5d3df"/><text x="137" y="221" text-anchor="middle" fill="#d9fff3" font-family="Arial,sans-serif" font-size="13" font-weight="700">ESP32</text><path d="M275 80h30M275 115h30M275 150h30" stroke="#f2cc60" stroke-width="5"/><circle cx="311" cy="80" r="6" fill="#f2cc60"/><circle cx="311" cy="115" r="6" fill="#f28da0"/><circle cx="311" cy="150" r="6" fill="#e0e8ef"/></g>
<!-- relay right -->
<g transform="translate(995 145)"><rect width="270" height="210" rx="24" fill="#21374e" stroke="#7992a8" stroke-width="2"/><rect x="68" y="38" width="134" height="94" rx="15" fill="#111d2b" stroke="#637b90"/><text x="135" y="94" text-anchor="middle" fill="#eaf2fb" font-family="Arial,sans-serif" font-size="20" font-weight="700">RELAY</text><text x="135" y="164" text-anchor="middle" fill="#b2c4d5" font-family="Arial,sans-serif" font-size="13">5V MODULE</text><circle cx="135" cy="187" r="9" fill="#68e9c5"><animate attributeName="opacity" values=".55;1;.55" dur="1.2s" repeatCount="indefinite"/></circle></g>
<!-- circuit paths -->
<path d="M441 215C570 130 822 130 988 205" fill="none" stroke="url(#mint)" stroke-width="5" stroke-dasharray="12 14" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.5s" repeatCount="indefinite"/></path><path d="M441 250H988" fill="none" stroke="#f0c85e" stroke-width="3" opacity=".75" stroke-dasharray="7 15"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.1s" repeatCount="indefinite"/></path><path d="M441 285C570 370 822 370 988 295" fill="none" stroke="#f08da0" stroke-width="3" opacity=".65" stroke-dasharray="7 15"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.3s" repeatCount="indefinite"/></path><circle r="7" fill="#b5ffe7" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M441 215C570 130 822 130 988 205"/></circle><circle r="5" fill="#fff0a6"><animateMotion dur="2.6s" repeatCount="indefinite" path="M441 250H988"/></circle>
<!-- central pulse switch -->
<g transform="translate(700 250)"><circle r="68" fill="#0c1b2b" stroke="#4fdbb7" stroke-width="3" filter="url(#glow)"><animate attributeName="r" values="63;70;63" dur="2s" repeatCount="indefinite"/></circle><path d="M10 -43L-23 5H0L-10 43 28 -9H5z" fill="url(#bolt)" filter="url(#glow)"><animate attributeName="opacity" values=".72;1;.72" dur="1.5s" repeatCount="indefinite"/></path></g>
<text x="700" y="438" text-anchor="middle" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="27" font-weight="700">SMART WIRELESS SWITCH</text><text x="700" y="470" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="15">ESP32 · RELAY MODULE · PERSIAN WEB APP · CLOUDFLARE</text>
</svg>
