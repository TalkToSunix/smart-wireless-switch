<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#18304a"/></linearGradient><linearGradient id="board" x2="1" y2="1"><stop stop-color="#15866f"/><stop offset="1" stop-color="#0b514d"/></linearGradient><linearGradient id="module" x2="0" y2="1"><stop stop-color="#28425b"/><stop offset="1" stop-color="#192b40"/></linearGradient><linearGradient id="glow"><stop stop-color="#74f0cb"/><stop offset="1" stop-color="#37b99d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity=".34"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#74f0cb"/></marker></defs>
<rect width="1400" height="790" rx="30" fill="url(#bg)"/><text x="700" y="55" text-anchor="middle" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="29" font-weight="700">ESP32 + RELAY MODULE · LOW-VOLTAGE CONTROL</text><text x="700" y="86" text-anchor="middle" fill="#a2b4c8" font-family="Arial,sans-serif" font-size="15">Conceptual wiring map · follow the exact labels printed on your own boards</text>
<!-- ESP32 board -->
<g filter="url(#shadow)"><rect x="100" y="175" width="455" height="430" rx="30" fill="url(#board)" stroke="#55c6a4" stroke-width="2"/><text x="327" y="223" text-anchor="middle" fill="#effbf7" font-family="Arial,sans-serif" font-size="23" font-weight="700">ESP32 DevKit</text><rect x="225" y="280" width="205" height="210" rx="18" fill="#172434" stroke="#8193a5" stroke-width="2"/><rect x="264" y="314" width="126" height="140" rx="12" fill="#283d53"/><path d="M279 333h96M279 351h96M279 369h96M279 387h96M279 405h96M279 423h96" stroke="#93a2b2" stroke-width="5"/><rect x="259" y="526" width="136" height="36" rx="8" fill="#c5d0db"/><text x="327" y="550" text-anchor="middle" fill="#203044" font-family="Arial,sans-serif" font-size="13" font-weight="700">USB POWER</text></g>
<!-- label pins on right edge -->
<g font-family="Arial,sans-serif" font-size="15" font-weight="700"><rect x="512" y="290" width="43" height="34" rx="8" fill="#f0c85e"/><text x="533" y="313" text-anchor="middle" fill="#1e2a3a">26</text><rect x="512" y="389" width="43" height="34" rx="8" fill="#f08ba1"/><text x="533" y="412" text-anchor="middle" fill="#1e2a3a">5V</text><rect x="512" y="486" width="43" height="34" rx="8" fill="#dce4ed"/><text x="533" y="509" text-anchor="middle" fill="#1e2a3a">GND</text></g>
<!-- relay module -->
<g filter="url(#shadow)"><rect x="850" y="180" width="430" height="425" rx="30" fill="url(#module)" stroke="#69839d" stroke-width="2"/><text x="1065" y="230" text-anchor="middle" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="22" font-weight="700">5V RELAY MODULE</text><rect x="950" y="270" width="230" height="140" rx="20" fill="#172333" stroke="#8193a5" stroke-width="2"/><text x="1065" y="325" text-anchor="middle" fill="#e9f1fa" font-family="Arial,sans-serif" font-size="23" font-weight="700">RELAY</text><text x="1065" y="356" text-anchor="middle" fill="#9eb1c6" font-family="Arial,sans-serif" font-size="14">electromagnetic switch</text><circle cx="1065" cy="460" r="10" fill="#76e9c4"/><text x="1065" y="505" text-anchor="middle" fill="#d5e2ef" font-family="Arial,sans-serif" font-size="15">LOW-VOLTAGE INPUT PINS</text><rect x="1041" y="537" width="48" height="38" rx="8" fill="#f0c85e"/><rect x="1110" y="537" width="48" height="38" rx="8" fill="#f08ba1"/><rect x="972" y="537" width="48" height="38" rx="8" fill="#dce4ed"/><text x="996" y="562" text-anchor="middle" fill="#203044" font-family="Arial,sans-serif" font-size="13" font-weight="700">GND</text><text x="1065" y="562" text-anchor="middle" fill="#203044" font-family="Arial,sans-serif" font-size="13" font-weight="700">IN</text><text x="1134" y="562" text-anchor="middle" fill="#203044" font-family="Arial,sans-serif" font-size="13" font-weight="700">VCC</text></g>
<!-- wires -->
<path d="M555 307H1041" stroke="#f0c85e" stroke-width="7" marker-end="url(#arrow)"/><path d="M555 406H1110" stroke="#f08ba1" stroke-width="7" marker-end="url(#arrow)"/><path d="M555 503H972" stroke="#dce4ed" stroke-width="7" marker-end="url(#arrow)"/>
<rect x="659" y="275" width="223" height="58" rx="14" fill="#142338" stroke="#4a5e75"/><text x="770" y="299" text-anchor="middle" fill="#f7d977" font-family="Arial,sans-serif" font-size="15" font-weight="700">GPIO 26 → IN</text><text x="770" y="319" text-anchor="middle" fill="#a9b9ca" font-family="Arial,sans-serif" font-size="12">control signal</text>
<rect x="659" y="375" width="270" height="58" rx="14" fill="#142338" stroke="#4a5e75"/><text x="794" y="399" text-anchor="middle" fill="#ff9bae" font-family="Arial,sans-serif" font-size="15" font-weight="700">5V/VIN → VCC*</text><text x="794" y="419" text-anchor="middle" fill="#a9b9ca" font-family="Arial,sans-serif" font-size="12">only if the module requires 5 V</text>
<rect x="659" y="472" width="223" height="58" rx="14" fill="#142338" stroke="#4a5e75"/><text x="770" y="496" text-anchor="middle" fill="#e5edf5" font-family="Arial,sans-serif" font-size="15" font-weight="700">GND ↔ GND</text><text x="770" y="516" text-anchor="middle" fill="#a9b9ca" font-family="Arial,sans-serif" font-size="12">shared logic ground</text>
<!-- Instructions -->
<rect x="87" y="644" width="1226" height="104" rx="20" fill="#111f31" stroke="#334961"/><text x="700" y="678" text-anchor="middle" fill="#74f0cb" font-family="Arial,sans-serif" font-size="17" font-weight="700">TURN OFF USB BEFORE MOVING JUMPERS · USE DUPONT WIRES / BREADBOARD FOR THIS DEMO</text><text x="700" y="708" text-anchor="middle" fill="#a8b8ca" font-family="Arial,sans-serif" font-size="14">*Module supply differs by model. Confirm its pin labels and 3.3 V logic compatibility from its datasheet. No mains wiring shown.</text><text x="700" y="731" text-anchor="middle" fill="#ff9ca8" font-family="Arial,sans-serif" font-size="12">This is a concept illustration, not a soldering photo or certified wiring plan. Keep relay contact terminals disconnected for the first test.</text>
</svg>
